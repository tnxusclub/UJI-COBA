<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan — Dola Kaos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <header class="header-fixed">
    <div class="header-inner">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div class="logo">RIWAYAT</div>
      <div></div>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <button class="close-sidebar"><i class="fa-solid fa-xmark"></i></button>
    <div class="sidebar-links">
      <a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a>
      <a href="produk.html"><i class="fa-solid fa-shirt"></i> Produk</a>
      <a href="riwayat.html" class="active"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</a>
      <hr>
      <a href="admin.html"><i class="fa-solid fa-gear"></i> Admin</a>
    </div>
  </nav>

  <main class="main-content">
    <section class="riwayat-section">
      <h2>Riwayat Pesanan</h2>
      <div class="riwayat-list" id="riwayatList">
        <p class="text-center">Memuat riwayat...</p>
      </div>
    </section>
  </main>

  <footer class="footer-fixed">
    <div class="footer-inner">
      <a href="https://wa.me/6281234567890" target="_blank" class="footer-link">
        <i class="fa-brands fa-whatsapp"></i> CS WhatsApp
      </a>
      <a href="https://instagram.com/" target="_blank" class="footer-link">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>
      <a href="https://tiktok.com/" target="_blank" class="footer-link">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyxxxxxx/exec"; // Ganti URL-mu
    
    async function loadRiwayat() {
      const res = await fetch(API_URL + "?action=getRiwayat");
      const json = await res.json();
      const list = document.getElementById("riwayatList");
      
      if (!json.data.length) {
        list.innerHTML = `<p class="text-center">Belum ada pesanan.</p>`;
        return;
      }
      
      list.innerHTML = json.data.map(item => `
        <div class="riwayat-card">
          <h4>${item[0]}</h4>
          <p><strong>Nama:</strong> ${item[1]}</p>
          <p><strong>Tanggal:</strong> ${item[5]}</p>
          <p><strong>Total:</strong> Rp${Number(item[4]).toLocaleString("id-ID")}</p>
          <span class="status-badge">${item[6]}</span>
        </div>
      `).join("");
    }
    
    loadRiwayat();
    
    // Menu sidebar
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    document.getElementById("menuToggle").onclick = () => {
      sidebar.classList.add("open"); overlay.classList.add("show");
    };
    document.querySelector(".close-sidebar").onclick = closeSidebar;
    overlay.onclick = closeSidebar;
    function closeSidebar() {
      sidebar.classList.remove("open"); overlay.classList.remove("show");
    }
  </script>
</body>
</html>
