<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk — Dola Kaos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <header class="header-fixed">
    <div class="header-inner">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div class="logo">PRODUK</div>
      <button class="cart-icon" id="cartIcon"><i class="fa-solid fa-cart-shopping"></i> <span id="cartBadge">0</span></button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <button class="close-sidebar"><i class="fa-solid fa-xmark"></i></button>
    <div class="sidebar-links">
      <a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a>
      <a href="produk.html" class="active"><i class="fa-solid fa-shirt"></i> Produk</a>
      <a href="riwayat.html"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</a>
      <hr>
      <a href="admin.html"><i class="fa-solid fa-gear"></i> Admin</a>
    </div>
  </nav>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>Keranjang</h3>
      <button class="close-cart"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cart-items" id="cartItems"><p class="cart-empty">Keranjang kosong</p></div>
    <div class="cart-voucher">
      <input type="text" id="voucherInput" placeholder="Kode Voucher">
      <button id="pakaiVoucher">Pakai</button>
    </div>
    <div class="cart-total">
      <p>Subtotal: <span id="subtotal">Rp0</span></p>
      <p>Diskon: <span id="diskon">Rp0</span></p>
      <p class="total-bayar">Total: <span id="totalBayar">Rp0</span></p>
    </div>
    <div class="cart-form">
      <input type="text" id="namaPembeli" placeholder="Nama Lengkap" required>
      <input type="tel" id="noWA" placeholder="Nomor WhatsApp" required>
      <textarea id="alamat" placeholder="Alamat Lengkap" required></textarea>
      <button class="btn-pesan" id="btnPesan">Kirim Pesanan via WhatsApp</button>
    </div>
  </aside>

  <main class="main-content">
    <!-- KATEGORI KAOS -->
    <section class="category-section">
      <h2>👕 Kaos</h2>
      <div class="products-grid" id="kaosGrid">
        <div class="loading">Memuat produk...</div>
      </div>
    </section>

    <!-- KATEGORI AKSESORI -->
    <section class="category-section">
      <h2>🎁 Aksesoris</h2>
      <div class="products-grid" id="aksesorisGrid">
        <div class="loading">Memuat produk...</div>
      </div>
    </section>
  </main>

  <footer class="footer-fixed">
    <div class="footer-inner">
      <a href="https://wa.me/6281234567890" target="_blank" class="footer-link">
        <i class="fa-brands fa-whatsapp"></i> CS WhatsApp
      </a>
      <a href="https://instagram.com/" target="_blank" class="footer-link">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>
      <a href="https://tiktok.com/" target="_blank" class="footer-link">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
