<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — TNXUS CLUB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root {
      --hitam: #0B090A;
      --merah: #D90429;
      --kuning: #FFBA08;
      --abu: #2B2B2B;
      --putih: #F8F9FA;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--hitam); color: var(--putih); min-height: 100vh; padding: 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .admin-header { text-align: center; padding: 1.5rem; background: linear-gradient(90deg, var(--merah), var(--kuning)); border-radius: 10px; margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.6rem; color: var(--hitam); }
    .tab-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab-btn { padding: 0.7rem 1.2rem; background: var(--abu); color: var(--putih); border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: var(--merah); }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fade 0.3s ease; }
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .card { background: var(--abu); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; }
    .card h3 { margin-bottom: 1rem; color: var(--kuning); }
    input, select, textarea { width: 100%; padding: 0.7rem; margin-bottom: 0.8rem; border-radius: 4px; border: none; background: var(--hitam); color: white; }
    button { padding: 0.7rem 1.2rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-primary { background: var(--merah); color: white; }
    .btn-primary:hover { background: #9B001C; }
    .btn-success { background: var(--kuning); color: var(--hitam); }
    .btn-success:hover { background: #E0A000; }
    .btn-danger { background: #444; color: white; }
    .btn-danger:hover { background: var(--merah); }
    .list-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem; background: var(--hitam); border-radius: 4px; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .list-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    .msg { padding: 0.8rem; border-radius: 4px; margin-bottom: 1rem; display: none; }
    .msg.sukses { background: rgba(0,180,0,0.2); border: 1px solid green; display: block; }
    .msg.error { background: rgba(180,0,0,0.2); border: 1px solid red; display: block; }
    .preview-img { max-width: 100px; max-height: 100px; object-fit: cover; border-radius: 4px; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <h1><i class="fa-solid fa-gear"></i> PANEL ADMIN — TNXUS CLUB</h1>
    </div>

    <div id="pesan" class="msg"></div>

    <!-- TAB MENU -->
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="produk"><i class="fa-solid fa-shirt"></i> Produk</button>
      <button class="tab-btn" data-tab="slide"><i class="fa-solid fa-images"></i> Slide Beranda</button>
      <button class="tab-btn" data-tab="riwayat"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Pesanan</button>
    </div>

    <!-- === TAB PRODUK === -->
    <div class="tab-content active" id="tab-produk">
      <div class="card">
        <h3 id="formTitle">➕ Tambah Produk Baru</h3>
        <form id="formProduk">
          <input type="hidden" id="produkId">
          <input type="text" id="namaProduk" placeholder="Nama Produk" required>
          <select id="kategoriProduk">
            <option value="baju">Baju / Kaos</option>
            <option value="aksesoris">Aksesoris</option>
          </select>
          <input type="text" id="fotoProduk" placeholder="Link URL Foto (dari GitHub/imgur dll)" required>
          <div style="margin-bottom:0.5rem;">Preview Foto:</div>
          <img id="previewFoto" class="preview-img" style="display:none;">
          <textarea id="deskripsiProduk" placeholder="Deskripsi Produk" rows="2"></textarea>
          <input type="text" id="ukuranProduk" placeholder="Ukuran (pisahkan dengan koma, contoh: S,M,L,XL)" required>
          <input type="number" id="hargaProduk" placeholder="Harga (tanpa titik)" required>
          <input type="number" id="stokProduk" placeholder="Stok Produk" required>
          <button type="submit" class="btn-primary">Simpan Produk</button>
          <button type="reset" class="btn-danger" style="margin-left:0.5rem;">Reset</button>
        </form>
      </div>

      <div class="card">
        <h3>📦 Daftar Produk</h3>
        <div id="daftarProduk"><p>Memuat data...</p></div>
      </div>
    </div>

    <!-- === TAB SLIDE BERANDA === -->
    <div class="tab-content" id="tab-slide">
      <div class="card">
        <h3>🖼️ Atur Foto Slide Beranda</h3>
        <p style="color:#aaa;font-size:0.9rem;margin-bottom:1rem;">Masukkan link foto, satu per baris. Urutan dari atas ke bawah = kiri ke kanan</p>
        <textarea id="slideLinks" rows="8" placeholder="https://link-foto-1.jpg&#10;https://link-foto-2.jpg"></textarea>
        <button id="simpanSlide" class="btn-success">Simpan Semua Slide</button>
      </div>
      <div class="card">
        <h3>👁️ Preview Slide Saat Ini</h3>
        <div id="previewSlide" style="display:flex;gap:0.5rem;flex-wrap:wrap;"></div>
      </div>
    </div>

    <!-- === TAB RIWAYAT === -->
    <div class="tab-content" id="tab-riwayat">
      <div class="card">
        <h3>📋 Semua Transaksi Pesanan</h3>
        <div id="daftarRiwayat"><p>Memuat data...</p></div>
      </div>
    </div>
  </div>

  <script>
    // === KONFIGURASI ===
    const API_URL = "https://script.google.com/macros/s/AKfycbxzjSiycQgBwx9mGVqoTHQrtotSsfAn3rWzOc6V5lEiq_9uSHS41rgeubeWWRSxjg8bgQ/exec"; // Ganti URL SAMA SEPERTI di index.html

    // === TAB SWITCHING ===
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
        if (btn.dataset.tab === "riwayat") muatRiwayatAdmin();
      });
    });

    // === PESAN ===
    function tampilPesan(teks, jenis="sukses") {
      const el = document.getElementById("pesan");
      el.textContent = teks;
      el.className = `msg ${jenis}`;
      setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    // === PREVIEW FOTO PRODUK ===
    document.getElementById("fotoProduk").addEventListener("input", e => {
      const url = e.target.value.trim();
      const preview = document.getElementById("previewFoto");
      if (url) { preview.src = url; preview.style.display = "block"; }
      else preview.style.display = "none";
    });

    // === PRODUK ===
    async function muatProdukAdmin() {
      try {
        const res = await fetch(`${API_URL}?action=getProduk`);
        const list = await res.json();
        const container = document.getElementById("daftarProduk");
        if (!list.length) { container.innerHTML = `<p style="color:#888;">Belum ada produk.</p>`; return; }
        container.innerHTML = list.map(p => `
          <div class="list-item">
            <img src="${p.foto}" alt="">
            <div style="flex:1;min-width:150px;">
              <strong>${p.nama}</strong><br>
              <small style="color:#aaa;">${p.kategori} • Rp ${Number(p.harga).toLocaleString("id-ID")} • Stok: ${p.stok}</small>
            </div>
            <button class="btn-danger" onclick="hapusProduk('${p.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        `).join("");
      } catch { tampilPesan("Gagal memuat produk", "error"); }
    }

    document.getElementById("formProduk").addEventListener("submit", async e => {
      e.preventDefault();
      const id = document.getElementById("produkId").value;
      const data = {
        nama: document.getElementById("namaProduk").value,
        kategori: document.getElementById("kategoriProduk").value,
        foto: document.getElementById("fotoProduk").value,
        deskripsi: document.getElementById("deskripsiProduk").value,
        ukuran: document.getElementById("ukuranProduk").value.split(",").map(s=>s.trim()),
        harga: Number(document.getElementById("hargaProduk").value),
        stok: Number(document.getElementById("stokProduk").value)
      };

      try {
        const res = await fetch(`${API_URL}?action=tambahProduk`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(data)
        });
        await res.json();
        tampilPesan("✅ Produk berhasil disimpan!");
        e.target.reset();
        document.getElementById("previewFoto").style.display = "none";
        muatProdukAdmin();
      } catch { tampilPesan("❌ Gagal menyimpan produk", "error"); }
    });

    async function hapusProduk(id) {
      if (!confirm("Yakin ingin menghapus produk ini?")) return;
      try {
        await fetch(`${API_URL}?action=hapusProduk`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({id})
        });
        tampilPesan("✅ Produk dihapus");
        muatProdukAdmin();
      } catch { tampilPesan("❌ Gagal menghapus produk", "error"); }
    }

    // === SLIDE BERANDA ===
    async function muatSlideAdmin() {
      try {
        const res = await fetch(`${API_URL}?action=getSlide`);
        const list = await res.json();
        document.getElementById("slideLinks").value = list.map(s=>s.foto).join("\n");
        document.getElementById("previewSlide").innerHTML = list.map(s=>`<img src="${s.foto}" style="width:100px;height:100px;object-fit:cover;border-radius:4px;">`).join("");
      } catch { console.log("Gagal muat slide"); }
    }

    document.getElementById("simpanSlide").addEventListener("click", async () => {
      const teks = document.getElementById("slideLinks").value.trim();
      if (!teks) return tampilPesan("Masukkan link foto!", "error");
      const slides = teks.split("\n").map(s=>s.trim()).filter(s=>s);
      try {
        await fetch(`${API_URL}?action=updateSlide`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({slides})
        });
        tampilPesan("✅ Slide diperbarui!");
        muatSlideAdmin();
      } catch { tampilPesan("❌ Gagal menyimpan slide", "error"); }
    });

    // === RIWAYAT ===
    async function muatRiwayatAdmin() {
      try {
        const res = await fetch(`${API_URL}?action=getRiwayat`);
        const list = await res.json();
        const container = document.getElementById("daftarRiwayat");
        if (!list.length) { container.innerHTML = `<p style="color:#888;">Belum ada pesanan masuk.</p>`; return; }
        container.innerHTML = list.map(r => {
          let detail = "";
          try { detail = typeof r.detail === "string" ? JSON.parse(r.detail) : r.detail; }
          catch { detail = r.detail; }
          const strDetail = Array.isArray(detail) 
            ? detail.map(i => `${i.nama} (${i.ukuran}) × ${i.jumlah} = Rp ${(i.harga*i.jumlah).toLocaleString("id-ID")}`).join(" | ")
            : detail;
          return `
            <div class="list-item" style="display:block;">
              <div><strong>${r.id}</strong> — <span style="color:var(--kuning);">${r.status}</span></div>
              <div>Nama: ${r.nama} | WA: ${r.noWA} | ${r.tanggal}</div>
              <div>Alamat: ${r.alamat}</div>
              <div style="color:#aaa;font-size:0.9rem;">${strDetail}</div>
              <div style="color:var(--kuning);font-weight:bold;margin-top:0.3rem;">Total: Rp ${Number(r.total).toLocaleString("id-ID")}</div>
            </div>
          `;
        }).join("");
      } catch { document.getElementById("daftarRiwayat").innerHTML = `<p style="color:var(--merah);">Gagal memuat riwayat</p>`; }
    }

    // === INISIALISASI ===
    document.addEventListener("DOMContentLoaded", () => {
      muatProdukAdmin();
      muatSlideAdmin();
    });
  </script>
</body>
</html>
