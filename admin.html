<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - KaosKita</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <header class="admin-header">
            <h1><i class="fas fa-cog"></i> Panel Admin - KaosKita</h1>
            <a href="index.html" class="btn-secondary">← Kembali ke Toko</a>
        </header>

        <!-- FORM TAMBAH PRODUK -->
        <div class="admin-card">
            <h2>Tambah / Edit Produk</h2>
            <form id="productForm" class="admin-form">
                <input type="hidden" id="editProductId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nama Produk</label>
                        <input type="text" id="prodName" required>
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="prodCategory">
                            <option value="baju">Kaos</option>
                            <option value="aksesori">Aksesori</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Link Foto Produk</label>
                    <input type="url" id="prodImage" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="prodDesc" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Harga (Rp)</label>
                        <input type="number" id="prodPrice" required>
                    </div>
                    <div class="form-group">
                        <label>Stok</label>
                        <input type="number" id="prodStock" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ukuran Tersedia (pisahkan dengan koma, contoh: S,M,L,XL)</label>
                    <input type="text" id="prodSizes" placeholder="S,M,L,XL">
                </div>
                <button type="submit" class="btn-primary">Simpan Produk</button>
            </form>
        </div>

        <!-- DAFTAR PRODUK -->
        <div class="admin-card">
            <h2>Daftar Produk</h2>
            <div class="product-list-admin" id="productListAdmin">
                <p>Memuat data...</p>
            </div>
        </div>

        <!-- EDIT SLIDER BERANDA -->
        <div class="admin-card">
            <h2>Edit Foto Slide Beranda</h2>
            <div id="sliderEditContainer">
                <p>Memuat slide...</p>
            </div>
            <button class="btn-primary" id="addSlideBtn">+ Tambah Slide Baru</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
