<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — Toko Kaos</title>
  <style>
    :root { --hitam:#000; --merah:#E50914; --kuning:#FFD700; --putih:#fff; --abu:#222; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: var(--hitam); color: var(--putih); padding: 20px; max-width: 900px; margin: 0 auto; }
    h1, h2 { margin: 20px 0; border-left: 4px solid var(--merah); padding-left: 10px; }
    .card { background: var(--abu); padding: 20px; border-radius: 1px; margin-bottom: 20px; }
    input, button, textarea, select {
      width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 5px;
      border: 1px solid #444; background: #111; color: white;
    }
    button { background: var(--merah); border: none; font-weight: bold; cursor: pointer; }
    button.sukses { background: green; }
    button.kuning { background: var(--kuning); color: #000; }
    button.hapus { background: #aa0000; width: auto; padding: 6px 10px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
    th { background: #333; }
    .tab-btn { display: inline-block; padding: 10px 20px; background: #333; margin-right: 5px; border-radius: 5px; cursor: pointer; }
    .tab-btn.aktif { background: var(--merah); }
    .tab-konten { display: none; }
    .tab-konten.aktif { display: block; }
  </style>
</head>
<body>
  <h1>🔧 PANEL ADMIN — TOKO KAOS</h1>
  
  <div>
    <span class="tab-btn aktif" onclick="bukaTab('produk-tab')">Produk</span>
    <span class="tab-btn" onclick="bukaTab('slide-tab')">Slide Beranda</span>
    <span class="tab-btn" onclick="bukaTab('riwayat-tab')">Riwayat Pesanan</span>
  </div>

  <!-- TAB PRODUK -->
  <div id="produk-tab" class="tab-konten aktif">
    <div class="card">
      <h2>➕ Tambah / Edit Produk</h2>
      <input type="hidden" id="editProdukId">
      <label>Nama Produk:</label>
      <input type="text" id="namaProduk" placeholder="Contoh: Kaos Polos Premium">
      
      <label>Deskripsi Singkat:</label>
      <textarea id="deskripsiProduk" rows="2" placeholder="Contoh: Bahan katun 30s, adem dipakai"></textarea>
      
      <label>Kategori:</label>
      <select id="kategoriProduk">
        <option value="produk">👕 Kaos / Produk Utama</option>
        <option value="aksesoris">🎁 Aksesori</option>
      </select>
      
      <label>Ukuran (pisahkan dengan koma):</label>
      <input type="text" id="ukuranProduk" placeholder="Contoh: S,M,L,XL">
      
      <label>Harga (tanpa titik):</label>
      <input type="number" id="hargaProduk" placeholder="Contoh: 85000">
      
      <label>Stok:</label>
      <input type="number" id="stokProduk" placeholder="Contoh: 50">
      
      <label>Link Foto (GitHub):</label>
      <input type="text" id="fotoProduk" placeholder="https://raw.githubusercontent.com/.../foto.jpg">
      
      <button class="sukses" onclick="simpanProduk()">💾 Simpan Produk</button>
    </div>

    <div class="card">
      <h2>📋 Daftar Produk</h2>
      <div id="daftarProdukAdmin"></div>
    </div>
  </div>

  <!-- TAB SLIDE BERANDA -->
  <div id="slide-tab" class="tab-konten">
    <div class="card">
      <h2>➕ Tambah Slide Foto Beranda</h2>
      <label>Link Foto Slide (GitHub):</label>
      <input type="text" id="fotoSlide" placeholder="https://raw.githubusercontent.com/.../slide.jpg">
      
      <label>Urutan Tampilan:</label>
      <input type="number" id="urutanSlide" placeholder="1, 2, 3..." min="1">
      
      <button class="sukses" onclick="tambahSlide()">💾 Simpan Slide</button>
    </div>

    <div class="card">
      <h2>🖼️ Daftar Slide Aktif</h2>
      <div id="daftarSlideAdmin"></div>
    </div>
  </div>

  <!-- TAB RIWAYAT PESANAN -->
  <div id="riwayat-tab" class="tab-konten">
    <div class="card">
      <h2>📋 Semua Pesanan Masuk</h2>
      <div id="daftarRiwayatAdmin"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
